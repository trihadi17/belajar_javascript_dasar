<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debugger</title>
  </head>
  <body>
    <script>
      // Debugger
      // Debugger digunakan untuk melakukan proses debugging
      // Debugging adalah proses mencari bug (masalah) yang biasa terjadi di kode program kita
      // Dengan debugger kita bisa menghentikan kode program di posisi yang kita inginkan (breakpoint), lalu melihat semua isi variable yang ada pada saat kode program sedang berhenti
      // NOTED : Tambahkan kata kunci "debugger" (dengan syarat browser harus mendukung)

      // Cara buka debugging pada browser, harus udah di posisi inspect element, kemudian refresh jika tidak muncul

      function createFullName(firstName, middleName, lastName) {
        // debugger;
        const fullName = `${firstName} ${lastName} ${lastName}`;
        return fullName;
      }

      const name = createFullName("Tri", "Hadi", "Putra");
      console.info(name);

      function sum(...numbers) {
        debugger;

        let total = 0;
        for (const number of numbers) {
          total += number;
        }

        return total;
      }

      console.info(sum(1, 1, 1, 1, 1));
    </script>
  </body>
</html>
