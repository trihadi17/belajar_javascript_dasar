<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Do While Loop</title>
  </head>
  <body>
    <script>
      // DO WHILE
      // Do while mirip dengan while
      // Perbedaan nya terletak pada pengecekan kondisi, while pengecekan kondisi di awal sebelum perulangan dilakukan sedangkan do while dilakukan setelah perulangan
      // Do while, minimal pasti sekali perulangan walaupun kondisi bernilai false

      let counter = 1;
      do {
        document.writeln(`<p>Perulangan ke ${counter}</p>`);
        counter++;
      } while (counter <= 10);
    </script>
  </body>
</html>
