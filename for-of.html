<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For Of</title>
  </head>
  <body>
    <script>
      // FOR OF
      // For Of digunakan untuk melakukan iterasi terhadap value dari iterable object seperti Array, String (Seperti Karakter) dll
      // For of tidak digunakan untuk melakukan iterasi data di object, karena object bukanlah iterable

      // ARRAY (Iterasi/Menampilkan data pada Array)
      const cities = ["Pekanbaru", "Padang", "Jogja"];
      for (const city of cities) {
        document.writeln(`<p>${city}</p>`);
      }

      // ARRAY Didalam Object
      const names = {
        messages: 1,
        data: ["Eko", "Kurniawan", "Khannedy"],
      };
      for (const name of names.data) {
        document.writeln(`<p>${name}</p>`);
      }

      // String (Dia akan menampilkan per karakter)
      const fullName = "Trihadi Putra";
      for (const character of fullName) {
        document.writeln(`<p>${character}</p>`);
      }
    </script>
  </body>
</html>
