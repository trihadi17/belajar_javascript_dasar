<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function Anonymous</title>
  </head>
  <body>
    <script>
      // Function Anonymous (Function tanpa nama) -> SERING DIGUNAKAN DI JS
      // Kota juga bisa membuat function tanpa nama function (anonymous)
      // Kita bisa buat anonymous function dalam sebuah variable atau bisa juga kita buat ketika mengisi parameter

      // CARA MEMBUAT ANONYMOUS FUNCTION
      // 1. Masukkan ke variable
      // 2. Masukkan ke Parameter
      // NOTED : Tidak bisa lansung -> function (name)

      // Anonymous Function di Variable
      let say = function (name) {
        document.writeln(`<p>Hello ${name}</p>`);
      };

      say("Tri");
      say("Hadi");

      // Anonymous Function di Parameter
      function giveMeName(callback) {
        callback("Putra");
      }

      giveMeName(say); // Cara 1
      giveMeName(function (name) {
        document.writeln(`<p>Hi ${name}</p>`);
      }); // Cara 2, tinggal tambahkan koma jika ada lebih dari satu sebelum tutup kurung
    </script>
  </body>
</html>
