<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function Dalam Function</title>
  </head>
  <body>
    <script>
      // FUNCTION DALAM FUNCTION (NESTED FUNCTION)
      // Tidak ada batasan dimana kita membuat function
      // Termasuk jika kita ingin membuat function di dalam sebuah function, kita bisa melakukannya
      // Function yang terdapat di dalam, kita sebut inner function
      // Inner function hanya bisa diakses ditempat kita membuat function, tidak bisa diakses dari luar function nya

      // parent
      function outer() {
        // child function
        function inner() {
          console.info("Inner");
        }

        // Function inner, bisa dipanggil selama di dalam scope function outer, diluar itu tidak bisa (akan error)
        inner();
        inner();
      }

      outer();
      inner(); // error, Function inner, bisa dipanggil selama di dalam scope function outer, diluar itu tidak bisa (akan error)
    </script>
  </body>
</html>
