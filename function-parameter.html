<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function Parameter</title>
  </head>
  <body>
    <script>
      // FUNCTION PARAMETER
      // Function parameter adalah cara mengirim suatu data/value/informasi pada sebauh function yang biasa disebut "PARAMETER"
      // Parameter bisa dibuat lebih dari satu

      function sayHello(firstName, lastName) {
        document.writeln(`<p>Hello ${firstName} ${lastName}</p>`);
      }

      // Memanggil
      sayHello("Trihadi", "Putra");
      sayHello("Tiya", "Wulan");
    </script>
  </body>
</html>
