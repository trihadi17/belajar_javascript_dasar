<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function</title>
  </head>
  <body>
    <script>
      // FUNCTION
      // Function adalah blok kode porgram yang akan berjalan saat kita panggil atau biasa disebut method

      function sayHelloWorld() {
        document.writeln(`<p>Ini Function</p>`);
      }

      // Pemanggilan Function
      sayHelloWorld();
      sayHelloWorld(); // Bisa berkali-kali
    </script>
  </body>
</html>
