<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>If Expression</title>
  </head>
  <body>
    <script>
      // IF EXPRESSION
      // If Expression adalah mengekseskusi program tertentu ketika suatu kondisi terpenuhi

      // ELSE IF EXPRESSION
      // Else If digunakan ketika kita butuh membuat beberapa kondisi

      // ELSE EXPRESSION
      // Else Expression digunakan mengeksekusi program ketika if bernilai false/semua kondisi tidak terpenuhi

      const examValue = 70;

      if (examValue > 80) {
        document.writeln("<p>Good Job</p>");
      } else if (examValue > 60) {
        document.writeln("<b>Not Bad</b>");
      } else {
        document.writeln("<p>Try Again Next Year</p>");
      }
    </script>
  </body>
</html>
