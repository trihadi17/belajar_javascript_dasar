<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Label</title>
  </head>
  <body>
    <script>
      // LABEL (JARANG SEKALI DIGUNAKAN)
      // Label merupakan penanda yang bisa digunakan dengan kata kunci break dan continue
      // Secara default saat kita melakukan break atau continue, dia akan melakukan terhadap perulangan dimana kode break dan continue itu digunakan
      // Dengan menggunakan label, kita bisa melakukan break dan continue terhadap perulangan yang kita inginkan, asalkan pada perulangannya kita gunakan lable
      // Untuk membuat label, kita bisa menggunakan nama label lalu diikuti dengan : (titik dua) -> loopi: atau hadi:
      // Kesimpulan nya, dengan memberi label pada perulangan, ketika ada brea/continue dia akan mengeksekusi pada perulangan dalam scope label nya dan tidak secara keseluruhan

      loopi: for (let i = 0; i < 10; i++) {
        loopj: for (let j = 0; j < 100; j++) {
          if (j > 10) {
            continue loopi;
          }
          console.info(`${i} - ${j}`);
        }
      }
    </script>
  </body>
</html>
