<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masalah Variable Var</title>
  </head>
  <body>
    <script>
      // Masalah Variable Var
      // Alasannya tidak direkomendasikan, karena var tidak memiliki "SCOPE", yang artinya dia tidak mengikat ke local scope (dia akan mengeksekusi dan melanjutkan proses diluar local scope)

      // Contoh Kasus Dengan Let
      let i = 20; // -> Global Scope

      for (let i = 0; i < 10; i++) {
        console.info(`Local : ${i}`); // -> Local Scope, hasilnya menjadi angka (0-9)
      }

      console.info(`Global : ${i}`); // Nilainya tetap 20, karena dia tidak melanjutkan perulangan diatas

      // Contoh Kasus Dengan Var
      var j = 20; // -> Global Scope

      for (var j = 0; j < 10; j++) {
        console.info(`Local : ${j}`); // -> Local Scope, hasilnya menjadi angka (0-9)
      }

      console.info(`Global : ${j}`); // Nilainya meneruskan perulangan diatas sehingga menjadi 10, karena dia melanjutkan perulangan diatas
    </script>
  </body>
</html>
