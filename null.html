<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Null</title>
  </head>
  <body>
    <script>
      // NULL -> Representasi data kosong
      // NULL != Undefined
      // Perbedaan nya adalah Null berarti Variable sudah tambahkan Value nya, hanya saja Value nya null
      // Sedangkan Undefined adalah variable yang belum di deklarasikan atau belum ditambahkan value apapun

      //   let firstName = undefined; // Undefined
      //   let firstName; // Undefined
      let firstName = null; // null

      if (firstName === undefined) {
        console.log("UNDEFINED");
      } else if (firstName === null) {
        console.log("NULL");
      } else {
        console.log(null);
      }
    </script>
  </body>
</html>
