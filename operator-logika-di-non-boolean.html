<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operator Logika Di Non Boolean</title>
  </head>
  <body>
    <script>
      // Operator Logika Di Non Boolean
      // Sebelumnya kita sudah tahu bahwa operator logika AND (&&) dan OR (||) digunakan untuk dua data boolean
      // Namun berbeda di JavaScript, kita bisa menggunakan operator logika AND dan OR untuk tipe data non Boolean
      // Cth : if ( "hello" || 1) / if ( "hello" || "")

      // Operator OR (||) di Non Boolean
      // Opeartor logika OR, membaca dari kiri ke kanan
      // Operator ini akan mengambil nilai pertama yang "truthy"
      // Jika tidak ada satupun yang bernilai truthy (isi value dari variable), maka yang terakhir yang akan diambil

      // CONTOH
      console.info("Hello" || ""); // Hello, karena "Hello" (bernilai truhty) dan "" (falsy)
      console.info("" || []); // [], karena "" (falsy) dan "[]" (bernilai truhty) walaupun isi array atau object nanti kosong
      console.info("0" || "NOL"); // "0", karena keduanya bernilai truthy, maka yang diambil yang pertama
      console.info(0 || "NOL"); // NOL, karena angka 0 itu falsy
      console.info(null || "NULL"); // NULL, karena null itu falsy
      console.info(undefined || "UNDEFINED"); // UNDEFINED, karena undefined itu falsy
      console.info(0 || false); // false, karena jika keduanya falsy maka yang diambil yang terakhir

      const person = {
        firstName: "",
        lastName: "Putra",
      };

      const name = person.firstName || person.lastName;
      console.info(name); // Putra (person.lastName), karena person.firstName itu falsy karena string kosong ("")

      // Operator AND (&&) di Non Boolean
      // Operator logikan AND, membaca dari kiri ke kanan
      // Operator ini akan mengambil nilai pertama yang "falsy"
      // Jika tidak ada satupun yang bernilai falsy, maka yang terakhir yang akan di ambil
      // NOTED : KEBALIKAN DARI OPERATOR OR

      // CONTOH
      console.info("Hello" && ""); // "", karena nilai kedua itu falsy
      console.info("" && []); // ""
      console.info("0" && "NOL"); // "NOL"
      console.info(0 && "NOL"); // 0
      console.info(null && "NULL"); // null
      console.info(undefined && "UNDEFINED"); // undefined
      console.info(0 && false); // 0
    </script>
  </body>
</html>
