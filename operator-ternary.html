<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ternary Operator</title>
  </head>
  <body>
    <script>
      // TERNARY OPERATOR (kondisi ? true : false)
      // Ternary operator adalah operator sederhana dari if statement
      // Ternary opertor terdiri dari kondisi yang di evaluasi, jika menghasilkan true maka nilai pertama yang diambil, jika false maka nilai kedua diambil

      const nilai = 75;
      let ucapan;

      ucapan = nilai >= 75 ? "Selamat Anda Lulus" : "Silahkan Coba Lagi";

      document.writeln(`<p>${ucapan}</p>`);
    </script>
  </body>
</html>
