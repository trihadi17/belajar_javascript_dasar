<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operator TypeOf</title>
  </head>
  <body>
    <script>
      // OPERATOR TYPEOF
      // typeOf merupakan operator yang bisa kita gunakan untuk melihat tipe data sebuah value atau variable
      // karena JS itu bersifat dynamic language, jadi kadang kita perlu mengecek tipe data pada sebuah value/varibale menggunakan operator typeOf
      // hasil dari operator typeOf adalah dalam bentuk string tipe datanya

      // JENIS TYPE DATA dan HASIL TYPEOF

      // Undefined -> "undefined"
      // Null -> "object"
      // Boolean -> "boolean"
      // Number -> "number"
      // BigInt -> "bigint"
      // String -> "string"
      // Symbol -> "symbol"
      // Function -> "function"
      // Lainnya -> "object"

      let data = 100;

      const typeData = typeof data;
      document.writeln(`<p>${typeData}</p>`);
    </script>
  </body>
</html>
