<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popup Confirm</title>
  </head>
  <body>
    <script>
      // CONFIRM
      // Digunakan untuk meminta boolean (true/false) dari pengguna browser dalam bentuk popup input pilihan

      const masuk = confirm("Anda yakin mau masuk ?");

      if (masuk) {
        const name = prompt("Siapa Nama Anda ?");
        alert(`Hello ${name}`);
      } else {
        alert("Bye bye");
      }
    </script>
  </body>
</html>
