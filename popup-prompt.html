<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popup Prompt</title>
  </head>
  <body>
    <script>
      // PROMPT
      // Digunakan untuk meminta input string dari pengguna browser dalam bentuk popup input text

      const name = prompt("Siapa Nama Anda");

      alert(`Hello ${name}`);
    </script>
  </body>
</html>
