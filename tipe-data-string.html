<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tipe Data String</title>
  </head>
  <body>
    <script>
      // Tipe Data String, Diawali "" atau ''
      document.writeln("Trihadi");
      document.writeln("</br>");
      document.writeln("Putra");
      document.writeln("</br>");

      // Penambahan/Penggabungan String (Concat)
      // Gunakan +
      document.writeln("Nama Depan : " + "Trihadi");
      document.writeln("</br>");
      document.writeln("Nama Belakang : " + "Putra");
      document.writeln("</br>");

      // Esacpe Sequence -> Karakter Khsus dalam Javascript (\n, \t, \', \", \\')
      document.writeln("<textarea cols='100' rows='10'>");

      // Penggunaan \n -> Membuat Spasi Antar Karakter didalam satu kalimat (ENTER)
      document.write("Tri \nHadi \nPutra \n");

      // Penggunaan \t -> Membuat Tab (TAB)
      document.write("Mari \tNgoding \tBersama \n");

      // Penggunaan \' -> Membuat Tanda Petik Satu ('') pada kalimat
      document.write("'Belajar Javascript8' \n");

      // Penggunaan \" -> Membuat Tanda Petik Dua ("") pada kalimat
      document.write('"Programmer Ahli" \n');

      // Penggunaan \\ -> Membuat Tanda Backslash (\) pada kalimat
      document.write("\\Home\\Hadi \n");

      document.writeln("</textarea");
    </script>
  </body>
</html>
