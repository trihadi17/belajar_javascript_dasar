<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>While Loop</title>
  </head>
  <body>
    <script>
      // WHILE LOOP
      // While adalah perulangan yang lebih sederhana dibandingkan for loop
      // While loop hanya terdapat kondisi tanpa ada init statement dan post statement (didalam satu kurung)

      let counter = 0;
      while (counter <= 10) {
        document.writeln(`<p>Perulangan ke ${counter}</p>`);
        counter++;
      }
    </script>
  </body>
</html>
